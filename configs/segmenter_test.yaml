seed: 42
device: auto
output_dir: outputs/test_segmenter
data:
  root: data/acdc
  train_split: train
  val_split: val
  image_size:
  - 256
  - 512
  batch_size: 1
  workers: 0
  ignore_index: 255
model:
  pretrained_name: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
  num_classes: 19
training:
  epochs: 1
  learning_rate: 6.0e-05
  weight_decay: 0.01
  amp: true
  grad_clip: 1.0
  patience: 1

